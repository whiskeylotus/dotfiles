"$schema" = 'https://starship.rs/config-schema.json'

# Two lines: context on top, a bare prompt below so commands always start at the
# same column. Right side answers "where am I really" — claude session, worktree,
# remote host.

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$character"""

right_format = """
${custom.claude}\
${custom.worktree}\
$username\
$hostname"""

add_newline = true
command_timeout = 800

[palettes.tokyonight]
blue = '#7aa2f7'
cyan = '#7dcfff'
green = '#9ece6a'
magenta = '#bb9af7'
orange = '#ff9e64'
red = '#f7768e'
yellow = '#e0af68'
grey = '#565f89'
claude = '#d97757'
palette = 'tokyonight'

[directory]
# Inside a repo the path starts at the repo root, with the root name emphasised
# so "which project / where inside it" is one glance.
style = 'blue'
repo_root_style = 'bold blue'
before_repo_root_style = 'dimmed blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '
truncation_length = 4
truncate_to_repo = true
truncation_symbol = ''
read_only = ' '
read_only_style = 'red'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold yellow)'

[git_branch]
symbol = ' '
style = 'bold magenta'
format = 'on [$symbol$branch]($style) '
truncation_length = 24
truncation_symbol = '…'

[git_status]
style = 'yellow'
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '\$${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[git_state]
style = 'bold red'
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[cmd_duration]
min_time = 2000
style = 'grey'
format = '[ $duration]($style) '

# You are inside a shell spawned by Claude Code.
[custom.claude]
description = 'Claude Code session marker'
when = 'test -n "$CLAUDECODE"'
command = 'echo claude'
format = '[◆ $output]($style) '
style = 'bold claude'

# You are in a linked worktree, not the main checkout — the #1 way to lose work.
[custom.worktree]
description = 'git worktree name when not in the main checkout'
when = '''git rev-parse --absolute-git-dir 2>/dev/null | grep -q "/worktrees/"'''
command = 'basename "$(git rev-parse --show-toplevel)"'
format = '[⑂ $output]($style) '
style = 'bold orange'

[username]
show_always = false
style_user = 'yellow'
style_root = 'bold red'
format = '[$user]($style)'

[hostname]
ssh_only = true
ssh_symbol = ' '
style = 'bold red'
format = '[@$ssh_symbol$hostname]($style) '

# Toolchain versions are off by default — turn a module on when you start using it.
[nodejs]
disabled = true
[python]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[docker_context]
disabled = true
[package]
disabled = true
