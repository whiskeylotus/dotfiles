# tmux — prefix is C-a.  Reload: prefix r.  Cheatsheet: `cheat tmux`
# The visual contract:
#   status-left colour  -> which PROJECT (stable per session name)
#   window list         -> which ROLE, plus ✓ / ! markers from Claude hooks
#   bright pane border  -> which PANE has focus
#   pane border title   -> that pane's dir · branch

# ------------------------------------------------------------------ core ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB,xterm-ghostty:RGB"
set -ga terminal-features ",xterm-ghostty:usstyle"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g display-time 2000
set -g display-panes-time 2000
set -g set-titles on
set -g set-titles-string "#S · #W"
setw -g automatic-rename off
set -g allow-rename off
set -g detach-on-destroy off      # jump to another session instead of exiting

# ------------------------------------------------------------- keybindings ---
bind r source-file ~/.config/tmux/tmux.conf \; display "  config reloaded"

# splits keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r n next-window
bind -r p previous-window
bind Space last-window
bind Tab  switch-client -l          # last SESSION

bind x kill-pane
bind X kill-window
bind Q confirm-before -p "kill session #S? (y/n)" kill-session

bind m set -g mouse \; display "mouse: #{?mouse,on,off}"
bind z resize-pane -Z
bind e setw synchronize-panes \; display "sync: #{?pane_synchronized,on,off}"

# --------------------------------------------------------- claude / project ---
# prefix f : fuzzy jump to any project or worktree (creates the session if needed)
bind f display-popup -E -w 70% -h 60% "tsw"
# prefix C : new window running Claude in this repo
bind C new-window -c "#{pane_current_path}" -n claude "claude"
# prefix W : new Claude session on a fresh git worktree (prompts for branch name)
bind W command-prompt -p "worktree/branch:" "run-shell '~/dotfiles/bin/cw %1'"
# prefix g : lazygit in a popup
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
# prefix G : ephemeral shell popup in the current dir
bind ` display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# ------------------------------------------------------------- copy mode ----
setw -g mode-keys vi
bind $ copy-mode
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
bind p paste-buffer

# ---------------------------------------------------------------- styling ----
# Session-specific colours (status-left, active window, active border) are set by
# bin/tmux-session-color via the hooks at the bottom of this file.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1f2335,fg=#a9b1d6"
set -g status-left-length 40
set -g status-right-length 90

# window-status-style / -current-style are set per session by tmux-session-color,
# so the formats below carry no colours of their own.
set -g window-status-separator ""
set -g window-status-style "fg=#565f89,bg=#1f2335"
set -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"
set -g window-status-format " #I #W#{?window_bell_flag, 󰂚,}#{?#{==:#{@cc},done}, #[fg=#9ece6a]✓#[fg=#565f89],}#{?#{==:#{@cc},input}, #[fg=#e0af68]!#[fg=#565f89],} "
set -g window-status-current-format " #I #W#{?window_zoomed_flag, 󰊓,}#{?#{==:#{@cc},done}, ✓,}#{?#{==:#{@cc},input}, !,} "
set -g window-status-bell-style "fg=#f7768e,bg=#1f2335"

set -g status-right "#[fg=#565f89]#(~/dotfiles/bin/tmux-git-status '#{pane_current_path}')#[fg=#565f89] │ #[fg=#7dcfff]#{?client_prefix,󰌌 PREFIX ,}#[fg=#565f89]%H:%M "

set -g pane-border-status top
set -g pane-border-format " #[fg=#7aa2f7]#{b:pane_current_path}#[fg=#565f89]#{?#{!=:#{pane_title},#{host_short}}, · #{pane_title},} "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#565f89"
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g mode-style "bg=#3d59a1,fg=#c0caf5"

setw -g monitor-bell on
set -g visual-bell off
set -g bell-action other

# ------------------------------------------------------------------ hooks ----
set-hook -g after-new-session   'run-shell "~/dotfiles/bin/tmux-session-color"'
set-hook -g after-new-window    'run-shell "~/dotfiles/bin/tmux-session-color"'
set-hook -g client-session-changed 'run-shell "~/dotfiles/bin/tmux-session-color"'
set-hook -g session-renamed     'run-shell "~/dotfiles/bin/tmux-session-color"'
set-hook -g window-renamed      'run-shell "~/dotfiles/bin/tmux-session-color"'
# clear a window's Claude marker as soon as you look at it
set-hook -g after-select-window 'set -uw @cc'
set-hook -g pane-focus-in       'set -uw @cc'

# ---------------------------------------------------------------- plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'claude vim ssh btop lazygit'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'

# tpm's sensible plugin resets some of these — re-assert what we care about
set -g status-position bottom
set -sg escape-time 10
run-shell "~/dotfiles/bin/tmux-session-color"
